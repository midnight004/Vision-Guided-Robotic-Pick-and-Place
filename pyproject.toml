[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vision-robot-pick-place"
version = "1.0.0"
description = "Vision-Guided Robotic Pick-and-Place: Computer Vision, 3D Object Localization and Robotic Manipulation in Simulation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rabah Bouguezel"},
]
keywords = [
    "robotics", "computer-vision", "isaac-sim", "ros2",
    "object-detection", "yolo", "pick-and-place", "manipulation"
]

[project.urls]
Repository = "https://github.com/midnight004/Vision-Guided-Robotic-Pick-and-Place"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

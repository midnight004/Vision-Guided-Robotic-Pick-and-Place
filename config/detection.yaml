# ==============================================================================
# Object Detection Configuration
# Vision-Guided Robotic Pick-and-Place
# ==============================================================================

detection:
  # Detection mode: 'segmentation' (sim ground-truth masks, reliable),
  # 'yolo' (custom-trained model), or 'color' (HSV thresholding)
  mode: "segmentation"

  # Model settings
  model:
    architecture: "yolov8"
    variant: "yolov8n"  # nano for speed, can use yolov8s/m for accuracy
    weights: "yolov8n.pt"  # pretrained fallback
    custom_weights: "models/factory_yolov8n.pt"  # trained on synthetic dataset (Phase 3)
    device: "cpu"  # AMD GPU has no CUDA; CPU inference
    half_precision: false  # FP16 not used on CPU

  # Inference settings
  inference:
    confidence_threshold: 0.4
    nms_iou_threshold: 0.45
    max_detections: 20
    input_size: [640, 640]  # YOLO input resolution
    agnostic_nms: false
    
  # Class mapping
  # Maps COCO class IDs or custom class IDs to our object classes
  classes:
    # If using pretrained COCO model, map relevant classes
    coco_mapping:
      # We'll fine-tune or use color-based post-processing
      # COCO doesn't have colored boxes, so we use custom training
      enabled: false
      
    # Custom classes for our objects
    custom_classes:
      0: "red_box"
      1: "blue_box"
      2: "green_cylinder"
      3: "yellow_sphere"
      4: "red_can"
      5: "blue_capsule"
      6: "green_box"
      7: "yellow_bottle"
    
    num_classes: 8
    
  # Color-based classification (backup/enhancement)
  color_classification:
    enabled: true  # Use HSV color analysis to classify objects
    hsv_ranges:
      red:
        lower: [0, 80, 80]
        upper: [12, 255, 255]
        lower2: [160, 80, 80]
        upper2: [180, 255, 255]
      blue:
        lower: [95, 80, 80]
        upper: [135, 255, 255]
      green:
        lower: [36, 60, 60]
        upper: [90, 255, 255]
      yellow:
        lower: [12, 60, 60]
        upper: [35, 255, 255]

  # Visualization
  visualization:
    draw_boxes: true
    draw_labels: true
    draw_confidence: true
    draw_centers: true
    box_thickness: 2
    font_scale: 0.6
    colors:
      red_box: [0, 0, 255]  # BGR for OpenCV
      blue_box: [255, 0, 0]
      green_cylinder: [0, 255, 0]
      yellow_sphere: [0, 255, 255]
